    <text x="64" y="182" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#9da7b3">Cardápio em realidade aumentada: o prato aparece em 3D na sua mesa</text>
    <g transform="translate(64,214)"><rect width="71" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#f97316" stroke-opacity="0.45"/><text x="35.5" y="21" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#e6edf3">WebXR</text></g><g transform="translate(145,214)"><rect width="131" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#f97316" stroke-opacity="0.45"/><text x="65.5" y="21" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#e6edf3">model-viewer</text></g><g transform="translate(286,214)"><rect width="122" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#f97316" stroke-opacity="0.45"/><text x="61.0" y="21" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#e6edf3">glTF / USDZ</text></g><g transform="translate(418,214)"><rect width="88" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#f97316" stroke-opacity="0.45"/><text x="44.0" y="21" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#e6edf3">QR Code</text></g><g transform="translate(516,214)"><rect width="79" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#f97316" stroke-opacity="0.45"/><text x="39.5" y="21" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#e6edf3">Vercel</text></g>
    <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
