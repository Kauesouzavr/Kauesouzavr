<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Kauê Souza, desenvolvedor full stack. Já construí um sistema de crédito para uma loja de verdade, um bot de finanças no WhatsApp, um cardápio em realidade aumentada e um modelo de detecção de fraudes. Disponível para vagas.">
